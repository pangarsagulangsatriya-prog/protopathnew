<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F7F7F3" />
  
  <!-- Architectural Grid / Notation Fragment -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#D9D9D3" stroke-width="1" />
  </pattern>
  <rect x="600" y="0" width="600" height="630" fill="url(#grid)" />
  
  <!-- Notation Board Fragment lines -->
  <rect x="700" y="100" width="400" height="430" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="8 4" />
  <line x1="700" y1="315" x2="1100" y2="315" stroke="#111111" stroke-width="3" />
  <path d="M 900 100 L 900 530" fill="none" stroke="#A6321B" stroke-width="2" />
  
  <!-- Orange Stage Vector -->
  <line x1="100" y1="400" x2="450" y2="400" stroke="#E6461A" stroke-width="8" />
  <polygon points="450,400 420,380 420,420" fill="#E6461A" />
  
  <!-- Body-Axis Figure -->
  <g transform="translate(300, 150) scale(1.5)">
    <!-- Base skeleton -->
    <circle cx="50" cy="30" r="12" fill="none" stroke="#111111" stroke-width="3" />
    <line x1="50" y1="42" x2="50" y2="120" stroke="#111111" stroke-width="3" />
    <line x1="30" y1="60" x2="70" y2="60" stroke="#111111" stroke-width="3" />
    <line x1="50" y1="120" x2="35" y2="180" stroke="#111111" stroke-width="3" />
    <line x1="50" y1="120" x2="65" y2="180" stroke="#111111" stroke-width="3" />
    
    <!-- Lock markers -->
    <circle cx="50" cy="80" r="6" fill="#111111" />
    <rect x="42" y="78" width="16" height="4" fill="#E6461A" />
    
    <circle cx="50" cy="120" r="8" fill="#111111" />
    <rect x="38" y="118" width="24" height="4" fill="#E6461A" />
  </g>
  
  <!-- PROTO PATH Wordmark -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="80" height="80" fill="#E6461A" />
    <text x="40" y="52" font-family="monospace" font-size="32" font-weight="900" fill="#F7F7F3" text-anchor="middle">PP</text>
  </g>
  <text x="210" y="200" font-family="monospace" font-size="64" font-weight="900" fill="#111111" letter-spacing="10">PROTO PATH</text>
  
</svg>
